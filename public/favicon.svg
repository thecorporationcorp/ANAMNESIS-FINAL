<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a1a"/>

  <!-- Glow effect -->
  <circle cx="50" cy="50" r="35" fill="url(#glow)" opacity="0.3" filter="url(#blur)"/>

  <!-- Monitor grid pattern -->
  <g stroke="#00f0ff" stroke-width="0.5" opacity="0.6">
    <rect x="15" y="25" width="20" height="15" fill="none"/>
    <rect x="40" y="25" width="20" height="15" fill="none"/>
    <rect x="65" y="25" width="20" height="15" fill="none"/>
    <rect x="15" y="45" width="20" height="15" fill="none"/>
    <rect x="40" y="45" width="20" height="15" fill="none"/>
    <rect x="65" y="45" width="20" height="15" fill="none"/>
    <rect x="15" y="65" width="20" height="15" fill="none"/>
    <rect x="40" y="65" width="20" height="15" fill="none"/>
    <rect x="65" y="65" width="20" height="15" fill="none"/>
  </g>

  <!-- Center monitor highlighted -->
  <rect x="38" y="43" width="24" height="19" fill="#00f0ff" opacity="0.8"/>

  <!-- A symbol in center -->
  <text x="50" y="57" font-family="monospace" font-size="14" fill="#0a0a1a" text-anchor="middle" font-weight="bold">A</text>
</svg>
